name: Database

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "strumenti/applica_migrazioni.sh"
      - ".github/workflows/database.yml"
  workflow_dispatch:

concurrency:
  group: database
  cancel-in-progress: false

jobs:
  migrazioni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Installa il client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Applica le migrazioni
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash strumenti/applica_migrazioni.sh
